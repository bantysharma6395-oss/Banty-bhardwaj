<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banty Bhardwaj</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

body::before {
    content: "";
    position: fixed;
    width: 450px;
    height: 450px;
    background: #d4af37;
    filter: blur(180px);
    opacity: .18;
    border-radius: 50%;
    top: -150px;
    right: -120px;
}

.container {
    width: 92%;
    max-width: 900px;
    text-align: center;
    padding: 35px 20px;
    animation: appear 1.2s ease;
}

.photo {
    width: 210px;
    height: 210px;
    margin: auto;
    border-radius: 50%;
    padding: 5px;
    background: linear-gradient(135deg, #fff, #d4af37, #555);
    box-shadow: 0 0 45px rgba(212,175,55,.35);
}

.photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
}

.small {
    margin-top: 30px;
    color: #d4af37;
    letter-spacing: 5px;
    font-size: 13px;
    text-transform: uppercase;
}

h1 {
    margin-top: 12px;
    font-size: clamp(42px, 10vw, 82px);
    letter-spacing: 2px;
    background: linear-gradient(90deg, #fff, #d4af37, #fff);
    -webkit-background-clip: text;
    color: transparent;
}

.line {
    width: 90px;
    height: 2px;
    background: #d4af37;
    margin: 22px auto;
}

p {
    color: #aaa;
    font-size: 16px;
    letter-spacing: 2px;
}

.button {
    display: inline-block;
    margin-top: 30px;
    padding: 14px 30px;
    border: 1px solid #d4af37;
    border-radius: 30px;
    color: #d4af37;
    text-decoration: none;
    transition: .3s;
}

.button:hover {
    background: #d4af37;
    color: #050505;
    box-shadow: 0 0 25px rgba(212,175,55,.4);
}

footer {
    margin-top: 45px;
    color: #555;
    font-size: 12px;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="photo">
        <img src="photo.jpg" alt="Banty Bhardwaj">
    </div>

    <div class="small">Welcome to my world</div>

    <h1>Banty Bhardwaj</h1>

    <div class="line"></div>

    <p>Personal • Style • Life</p>

    <a class="button" href="https://www.instagram.com/" target="_blank">
        Instagram
    </a>

    <footer>
        © 2026 Banty Bhardwaj
    </footer>

</div>

</body>
</html>
